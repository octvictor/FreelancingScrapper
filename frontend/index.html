<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Freelancing Tools</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="brand">Freelancing Tools</div>
            <div class="sidebar-group">
                <button class="sidebar-group-header" type="button" data-collapse-target="nav-group-management">
                    <span class="sidebar-group-chevron">&#9662;</span>
                    <span>Management</span>
                </button>
                <ul class="nav-list" id="nav-group-management">
                    <li><button class="nav-item nav-item-chip active" data-page="tracker">
                        <span class="nav-item-icon">&#9635;</span> Project Manager
                    </button></li>
                    <li><button class="nav-item nav-item-chip" data-page="gatherer">
                        <span class="nav-item-icon">&#9638;</span> Studio Database
                    </button></li>
                </ul>
            </div>
        </aside>

        <main class="main">
            <section id="page-tracker">
                <h1 class="page-title">Project Manager</h1>
                <div class="tracker-toolbar">
                    <div class="view-toggle">
                        <button class="view-toggle-btn active" id="view-toggle-active" type="button" data-view="Active">Active</button>
                        <button class="view-toggle-btn" id="view-toggle-completed" type="button" data-view="Completed">Completed</button>
                    </div>
                </div>
                <div class="panel">
                    <div class="gatherer-table-wrap">
                        <table class="project-table">
                            <thead>
                                <tr>
                                    <th></th>
                                    <th>Title</th>
                                    <th>Description</th>
                                    <th>Status</th>
                                    <th>Paid</th>
                                </tr>
                            </thead>
                            <tbody id="project-table-body"></tbody>
                        </table>
                    </div>
                    <button class="btn btn-text" id="project-expand-btn" type="button" style="display:none; margin-top: 10px;">Show more</button>
                    <button class="btn" id="new-project-btn" style="margin-top: 12px;" type="button">+ New project</button>
                </div>
            </section>

            <section id="page-gatherer" style="display:none;">
                <h1 class="page-title">Studio Database</h1>
                <p class="muted" style="margin: -10px 0 18px;">Studios and companies you're tracking - add a row, fill it in, it saves as you type.</p>

                <div class="panel">
                    <div class="gatherer-table-wrap">
                        <table class="gatherer-table">
                            <thead>
                                <tr>
                                    <th>Title</th>
                                    <th>URL</th>
                                    <th>
                                        <select class="header-filter" id="filter-type">
                                            <option value="">Type</option>
                                            <option value="Studio">Studio</option>
                                            <option value="Company">Company</option>
                                        </select>
                                    </th>
                                    <th>
                                        <select class="header-filter" id="filter-status">
                                            <option value="">Status</option>
                                            <option value="Sent">Sent</option>
                                            <option value="Not sent">Not sent</option>
                                        </select>
                                    </th>
                                    <th>Date sent</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="gatherer-body"></tbody>
                        </table>
                    </div>
                    <button class="btn" id="gatherer-add-btn" style="margin-top: 12px;">+ Add row</button>
                </div>
            </section>
        </main>
    </div>

    <div class="modal-backdrop" id="project-modal-backdrop" style="display:none;">
        <div class="modal modal-wide">
            <button class="modal-close" id="project-modal-close" title="Close">&times;</button>

            <input type="text" class="modal-title-input" id="modal-title" placeholder="Untitled project">

            <textarea class="modal-description-input" id="modal-description" placeholder="Add a description..."></textarea>

            <div class="modal-top-row">
                <div class="modal-left-col">
                    <div class="modal-fields">
                        <div class="modal-field">
                            <label for="modal-status">Project status</label>
                            <select class="cell-select color-pill" id="modal-status">
                                <option value="Active">&#9679; Active</option>
                                <option value="Completed">&#9679; Completed</option>
                            </select>
                        </div>
                        <div class="modal-field">
                            <label for="modal-client">Client</label>
                            <input type="text" id="modal-client" placeholder="Client name">
                        </div>
                        <div class="modal-field">
                            <label for="modal-deadline">Deadline</label>
                            <input type="date" id="modal-deadline">
                        </div>
                        <div class="modal-field">
                            <label for="modal-day-rate">Day rate</label>
                            <div class="modal-field-group">
                                <div class="currency-input-wrap">
                                    <span class="currency-prefix" id="day-rate-prefix">$</span>
                                    <input type="number" id="modal-day-rate" min="0" step="0.01" placeholder="0.00">
                                </div>
                                <select class="cell-select" id="modal-currency">
                                    <option value="USD">USD</option>
                                    <option value="EUR">EUR</option>
                                    <option value="GBP">GBP</option>
                                    <option value="BRL">BRL</option>
                                </select>
                            </div>
                        </div>
                        <div class="modal-field">
                            <label>Docs</label>
                            <div class="modal-field-group">
                                <input type="file" id="doc-file-input" style="display:none;">
                                <button class="btn" id="doc-upload-btn" type="button">+ Add doc</button>
                            </div>
                        </div>
                    </div>

                    <div class="docs-list" id="docs-list"></div>
                </div>

                <div class="modal-side-panel">
                    <div class="modal-side-tabs">
                        <button class="modal-side-tab active" type="button" data-side-tab="assets">Assets</button>
                        <button class="modal-side-tab" type="button" data-side-tab="notes">Notes</button>
                        <button class="modal-side-tab" type="button" data-side-tab="briefing">Briefing</button>
                    </div>
                    <textarea class="modal-side-content" id="modal-side-content" placeholder="Add notes or paste links..."></textarea>
                </div>
            </div>

            <div class="modal-section">
                <p class="modal-section-title">Log</p>
                <div class="gatherer-table-wrap">
                    <table class="task-table">
                        <thead>
                            <tr>
                                <th>Task</th>
                                <th>Status</th>
                                <th>Duration</th>
                                <th>Observation</th>
                                <th>Cost</th>
                                <th>Date</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="task-table-body"></tbody>
                    </table>
                </div>
                <div class="log-footer">
                    <button class="btn" id="task-add-btn" type="button">+ Add task</button>
                    <div class="log-sum">
                        <span class="log-sum-label">Sum</span>
                        <span class="log-sum-value" id="log-sum-value">$0.00</span>
                    </div>
                </div>
            </div>

            <div class="modal-footer">
                <button class="btn btn-danger-text" id="delete-project-btn" type="button">Delete project</button>
            </div>
        </div>
    </div>

    <script src="/static/js/nav.js"></script>
    <script src="/static/js/gatherer.js"></script>
    <script src="/static/js/tracker.js"></script>
</body>
</html>
